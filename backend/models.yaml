# Model roles. Copy to models.yaml (or point MODELS_CONFIG at a file).
#
# Callers ask for a role, not a tag, so which model runs a given piece of work
# is deployment configuration rather than something baked into agent code.
#
# A role whose tag the VM does not serve falls back to the "fast" role, so a
# missing model degrades instead of breaking startup. Inspect the current state
# with:  python -m app.models
#
# Sizing note: the VM serves one model at a time - loading a second evicts the
# first. A cold load costs roughly 6s for an 8B and 19s for a 14B, against 0.3s
# once warm. Group work by model rather than alternating between them.

- role: fast
  tag: qwen3:8b
  description: Tool calls and short reasoning. The default and the fallback.

- role: deep
  tag: qwen2.5:14b-instruct-q4_K_M
  description: Planning and final synthesis, where quality decides the outcome.

- role: code
  tag: qwen2.5-coder:7b
  description: Code generation and review.

- role: vision
  tag: qwen2.5vl:7b
  description: Image understanding.

- role: embed
  tag: qwen3-embedding:0.6b
  description: >
    Embeddings for retrieval. Multilingual, which nomic-embed-text is not: on
    the Russian text of War and Peace nomic landed 1 of 6 answering chunks in
    the top 5, against 5 of 6 here and 6 of 6 within top-12, which is the
    top_k retrieval actually uses.

    Chosen over bge-m3, which scores marginally better (6 of 6 in top-5) but
    cannot run here: loading it needs ~5 GB transient despite settling at
    1.3 GB, and with qwen3:8b resident at num_ctx=32768 (8.16 GB of an 11.75 GB
    card) it dies with cudaMalloc out of memory. Measured alongside the 32k chat
    model: qwen3-embedding 10.33 GB total and works, bge-m3 OOMs, and bge-m3
    only fits if OLLAMA_NUM_CTX drops to 16384 or OLLAMA_MAX_LOADED_MODELS=1
    forces a model swap on every question. Prefer bge-m3 only if you take one
    of those trades.
